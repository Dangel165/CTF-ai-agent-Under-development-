[project]
name = "ctf-discord-bot"
version = "0.2.0"
description = "Universal CTF AI Discord bot — any platform via manual challenge input"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "httpx",
    "python-dotenv",
    "aiosqlite",
    "pyyaml",
    "markdownify",
    "beautifulsoup4",
    "cursor-sdk",
    "ctf-agent",
]

[tool.uv.sources]
ctf-agent = { path = "../universal" }

[project.scripts]
ctf-discord-bot = "bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]
