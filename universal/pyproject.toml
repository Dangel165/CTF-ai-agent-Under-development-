[project]
name = "ctf-agent"
version = "0.1.0"
description = "Universal CTF AI solver — any platform, manual challenge input"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "cursor-sdk",
    "rich>=13.0",
]

[project.scripts]
ctf-agent = "ctf_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctf_agent"]
